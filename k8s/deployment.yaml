apiVersion: apps/v1 # apps/v1 is the name of the department that handles Deployments
kind: Deployment

metadata:
  name: invint

spec:
  replicas: 1

  selector:
    matchLabels:
      app: invint

  template:
    metadata:
      labels:
        app: invint

    spec:
      containers:
      - name: invint

        image: invintelligence535.azurecr.io/investor-intelligence-platform:latest

        ports:
        - containerPort: 8000

        imagePullPolicy: Always

        envFrom:
        - secretRef:
            name: app-env
